name = "bot-watchdog"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bot-watchdog"
# Run `wrangler d1 create bot-watchdog` and paste the returned id below.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
PUBLIC_BASE_URL = "http://localhost:8787"
ALERT_FROM_EMAIL = "watchdog@example.com"

[assets]
directory = "./dashboard/dist"
